name: Build FFG Map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "flood_map.py"
      - ".github/workflows/build-map.yml"
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run map builder
        run: python flood_map.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update generated FFG map"
            git push
          fi
