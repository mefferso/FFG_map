<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA/MS Flash Flood Guidance</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />

    <style>
        html, body, #viewDiv {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        #info-banner {
            position: absolute;
            top: 12px;
            left: 58px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            color: #222;
            padding: 10px 14px;
            border-radius: 7px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            font-family: Arial, sans-serif;
            max-width: 360px;
        }

        #info-banner h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            line-height: 1.2;
        }

        #info-banner p,
        #ffg-status {
            margin: 0;
            font-size: 11px;
            color: #555;
            line-height: 1.3;
        }

        #ffg-status {
            margin-top: 5px;
            font-weight: 600;
        }

        .popup-small {
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.35;
        }

        .ffg-value {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="info-banner">
        <h3>LA/MS - Latest 1-Hr Flash Flood Guidance</h3>
        <p>NOAA/NWS ArcGIS MapServer layer. Click map to inspect identify response.</p>
        <div id="ffg-status">Loading FFG layer...</div>
    </div>

    <div id="viewDiv"></div>

    <script src="https://js.arcgis.com/4.30/"></script>

    <script>
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/layers/MapImageLayer",
            "esri/geometry/Extent",
            "esri/rest/identify",
            "esri/rest/support/IdentifyParameters",
            "esri/widgets/LayerList",
            "esri/widgets/Legend"
        ], function(Map, MapView, MapImageLayer, Extent, identify, IdentifyParameters, LayerList, Legend) {
            const mapServerUrl = "https://mapservices.weather.noaa.gov/raster/rest/services/precip/rfc_gridded_ffg/MapServer";

            const laMsExtent = new Extent({
                xmin: -94.25,
                ymin: 28.75,
                xmax: -88.00,
                ymax: 35.15,
                spatialReference: { wkid: 4326 }
            });

            const ffgLayer = new MapImageLayer({
                url: mapServerUrl,
                title: "1-Hr Flash Flood Guidance",
                opacity: 0.82,
                imageFormat: "png32",
                refreshInterval: 60,
                sublayers: [
                    {
                        id: 0,
                        title: "1-Hr FFG",
                        visible: true
                    }
                ]
            });

            const map = new Map({
                basemap: "dark-gray-vector",
                layers: [ffgLayer]
            });

            const view = new MapView({
                container: "viewDiv",
                map,
                extent: laMsExtent,
                constraints: {
                    geometry: laMsExtent.expand(1.25),
                    minZoom: 6,
                    maxZoom: 12,
                    rotationEnabled: false
                },
                popup: {
                    dockEnabled: false,
                    collapseEnabled: false
                }
            });

            function setStatus(message) {
                document.getElementById("ffg-status").textContent = message;
            }

            ffgLayer.when(function() {
                setStatus("FFG display layer loaded.");
                console.log("FFG MapImageLayer loaded:", ffgLayer);
            }).catch(function(error) {
                setStatus("FFG layer failed to load. Check console.");
                console.error("FFG layer load error:", error);
            });

            view.when(function() {
                view.goTo(laMsExtent, { animate: false }).catch(function(error) {
                    console.warn("Initial extent goTo warning:", error);
                });

                const layerList = new LayerList({
                    view: view
                });
                view.ui.add(layerList, "top-right");

                const legend = new Legend({
                    view: view,
                    layerInfos: [{ layer: ffgLayer, title: "1-Hr FFG" }]
                });
                view.ui.add(legend, "bottom-right");
            });

            function parseMaybeNumber(value) {
                if (value === undefined || value === null) return null;
                const num = parseFloat(String(value).trim());
                if (!Number.isFinite(num)) return null;
                if (num <= 0 || num > 20) return null;
                return num;
            }

            function getRawFfgValue(result) {
                const attrs = result.attributes || {};

                // Do NOT use Classify.Pixel Value as a real FFG amount. That is a display class/bucket,
                // which is why the previous version lied with the same value everywhere.
                const rawFieldNames = [
                    "Raster.ServicePixelValue",
                    "Raster.PixelValue",
                    "Pixel Value",
                    "Pixel value",
                    "PixelValue",
                    "ServicePixelValue",
                    "value"
                ];

                for (const name of rawFieldNames) {
                    const num = parseMaybeNumber(attrs[name]);
                    if (num !== null) return num;
                }

                const directValue = parseMaybeNumber(result.value);
                if (directValue !== null) return directValue;

                return null;
            }

            function getDisplayClass(result) {
                const attrs = result.attributes || {};
                return attrs["Classify.Pixel Value"] ?? attrs["Classify.PixelValue"] ?? attrs["Pixel Value"] ?? null;
            }

            view.on("click", async function(event) {
                const lat = event.mapPoint.latitude;
                const lon = event.mapPoint.longitude;

                view.popup.open({
                    title: "Sampling 1-Hr FFG",
                    location: event.mapPoint,
                    content: `<div class="popup-small"><i>Querying NOAA identify endpoint...</i></div>`
                });

                const params = new IdentifyParameters({
                    tolerance: 6,
                    returnGeometry: false,
                    layerOption: "all",
                    layerIds: [3],
                    geometry: event.mapPoint,
                    mapExtent: view.extent,
                    width: view.width,
                    height: view.height
                });

                try {
                    const response = await identify.identify(mapServerUrl, params);
                    console.log("Full ArcGIS identify response:", response);

                    const results = response.results || [];
                    if (results.length === 0) {
                        view.popup.open({
                            title: "No identify result",
                            location: event.mapPoint,
                            content: `
                                <div class="popup-small">
                                    NOAA did not return a result for this location.<br><br>
                                    <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lon.toFixed(4)}
                                </div>
                            `
                        });
                        return;
                    }

                    let rawFfg = null;
                    let displayClass = null;
                    let chosenResult = null;

                    for (const result of results) {
                        const testValue = getRawFfgValue(result);
                        if (displayClass === null) displayClass = getDisplayClass(result);
                        if (testValue !== null) {
                            rawFfg = testValue;
                            chosenResult = result;
                            break;
                        }
                    }

                    console.log("Chosen identify result:", chosenResult);
                    console.log("Raw FFG value:", rawFfg);
                    console.log("Display class value:", displayClass);

                    if (rawFfg === null) {
                        view.popup.open({
                            title: "No reliable raw FFG value",
                            location: event.mapPoint,
                            content: `
                                <div class="popup-small">
                                    The FFG layer is drawing, but the identify response did not expose a trustworthy raw rainfall threshold value.<br><br>
                                    ${displayClass !== null ? `<b>Display class returned:</b> ${displayClass}<br>` : ""}
                                    <span style="color:#666; font-size:11px;">
                                        I am intentionally not treating the display class as inches because it can be a category bucket, not the actual sampled FFG.
                                    </span><br><br>
                                    <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lon.toFixed(4)}
                                </div>
                            `
                        });
                        return;
                    }

                    view.popup.open({
                        title: "1-Hr Flash Flood Guidance",
                        location: event.mapPoint,
                        content: `
                            <div class="popup-small">
                                <strong>1-Hr FFG:</strong>
                                <span class="ffg-value">${rawFfg.toFixed(2)} inches</span><br>
                                <span style="color:#666; font-size:11px;">Raw value returned by NOAA identify endpoint.</span><br><br>
                                <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lon.toFixed(4)}
                            </div>
                        `
                    });
                } catch (error) {
                    console.error("Identify error:", error);
                    view.popup.open({
                        title: "Identify error",
                        location: event.mapPoint,
                        content: `
                            <div class="popup-small">
                                Could not query the NOAA/NWS identify endpoint.<br>
                                Check browser console for details.<br><br>
                                <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lon.toFixed(4)}
                            </div>
                        `
                    });
                }
            });
        });
    </script>
</body>
</html>
