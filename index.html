<script>
const map = L.map('map').setView([30.2, -90.5], 8);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

const wmsUrl = "https://mapservices.weather.noaa.gov/raster/services/precip/rfc_gridded_ffg/MapServer/WmsServer";

L.tileLayer.wms(wmsUrl, {
    layers: '0',
    format: 'image/png',
    transparent: true,
    opacity: 0.7,
    attribution: 'NOAA / NWS'
}).addTo(map);

map.on('click', function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    const popup = L.popup()
        .setLatLng(e.latlng)
        .setContent("<i>Sampling FFG grid...</i>")
        .openOn(map);

    const b = map.getBounds();
    const size = map.getSize();

    const mapExtent = [
        b.getWest(),
        b.getSouth(),
        b.getEast(),
        b.getNorth()
    ].join(',');

    const imageDisplay = `${size.x},${size.y},96`;

    const params = new URLSearchParams({
        f: "json",
        geometry: `${lng},${lat}`,
        geometryType: "esriGeometryPoint",
        sr: "4326",
        layers: "all:3",              // 1-hour FFG Image sublayer
        tolerance: "1",
        mapExtent: mapExtent,
        imageDisplay: imageDisplay,
        returnGeometry: "false",
        returnUnformattedValues: "true"
    });

    const identityUrl =
        "https://mapservices.weather.noaa.gov/raster/rest/services/precip/rfc_gridded_ffg/MapServer/identify?" +
        params.toString();

    fetch(identityUrl)
        .then(response => response.json())
        .then(data => {
            console.log("Identify response:", data);

            if (!data.results || data.results.length === 0) {
                popup.setContent(`
                    <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lng.toFixed(4)}<br>
                    <span style="color:#888;">No FFG grid value returned here.</span>
                `);
                return;
            }

            const result = data.results[0];
            const attrs = result.attributes || {};

            const possibleValue =
                attrs["Pixel Value"] ??
                attrs["Pixel value"] ??
                attrs["PixelValue"] ??
                attrs["Raster.PixelValue"] ??
                attrs["Stretched value"] ??
                result.value;

            const ffg = parseFloat(possibleValue);

            if (!Number.isFinite(ffg) || ffg <= 0 || ffg > 20) {
                popup.setContent(`
                    <b>Bad/unsupported sampled value:</b> ${possibleValue}<br>
                    <span style="color:#888;">
                        That is not a valid 1-hr FFG value. Check console response.
                    </span><br><br>
                    <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lng.toFixed(4)}
                `);
                return;
            }

            popup.setContent(`
                <div style="font-family:Arial; font-size:13px;">
                    <strong>1-Hr FFG:</strong>
                    <span style="color:#d9534f; font-weight:bold;">${ffg.toFixed(2)} inches</span><br>
                    <span style="color:#666; font-size:11px;">
                        Rainfall required in 1 hour to initiate flash flooding.
                    </span><br><br>
                    <hr style="border:0; border-top:1px solid #ddd; margin:5px 0;">
                    <b>Lat:</b> ${lat.toFixed(4)} | <b>Lng:</b> ${lng.toFixed(4)}
                </div>
            `);
        })
        .catch(error => {
            console.error("Identify error:", error);
            popup.setContent("<b>Error:</b> Could not query NOAA/NWS FFG service.");
        });
});
</script>
